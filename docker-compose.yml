services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credalyx
      POSTGRES_PASSWORD: credalyx
      POSTGRES_DB: credalyx
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credalyx -d credalyx"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - credalyx-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
volumes:
  credalyx-postgres:
