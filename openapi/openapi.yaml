openapi: 3.1.0
info:
  title: CREDALYX Agent Passport API
  version: 0.5.0
  description: |
    API for agent registration/control, versioned agent keys, hosted passport checkout,
    signed CREDALYX Agent Passports, issuer verification-key discovery, referral wallet
    views and payment reversals. Agent Passports are private-sector software credentials,
    not government identity documents, licences, KYC results or regulatory approvals.
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': { description: Healthy }

  /.well-known/agent-card.json:
    get:
      security: []
      summary: A2A Protocol v1.0 discovery card
      responses:
        '200': { description: A2A Agent Card }

  /.well-known/agent-passport-issuer.json:
    get:
      security: []
      summary: Discover Agent Passport issuer metadata
      responses:
        '200':
          description: Issuer metadata including current signing key and JWKS URI
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuerMetadata' }

  /.well-known/jwks.json:
    get:
      security: []
      summary: Fetch active and retired non-revoked issuer verification keys
      description: Private JWK parameters are never exposed. Revoked issuer keys are excluded.
      responses:
        '200':
          description: Public Ed25519 verification keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }

  /v1/issuer/keys/{issuer_key_id}:
    parameters:
      - $ref: '#/components/parameters/IssuerKeyId'
    get:
      security: []
      summary: Resolve an exact issuer verification key and live status
      responses:
        '200':
          description: Issuer public key descriptor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuerKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents:
    post:
      summary: Register an agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '201': { description: Agent registered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Registration or referral conflict }

  /v1/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      security: []
      summary: Read public agent registry data
      responses:
        '200': { description: Public agent record }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{agent_id}/keys/current:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      security: []
      summary: Resolve the current active agent key
      responses:
        '200':
          description: Current Ed25519 key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{agent_id}/keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/AgentKeyId'
    get:
      security: []
      summary: Resolve an exact current or historical agent key
      responses:
        '200':
          description: Historical key descriptor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoricalAgentKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{agent_id}/challenge:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: Create a key-bound one-time agent-control challenge
      responses:
        '200': { description: Challenge, exact signing payload and bound key ID }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Agent/key not eligible }

  /v1/agents/{agent_id}/verify-control:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: Verify Ed25519 proof of possession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge, signature]
              properties:
                challenge: { type: string }
                signature: { type: string, description: Base64url Ed25519 signature over the returned signing_payload }
      responses:
        '200': { description: Level 1 control verified }
        '401': { description: Invalid, expired, replayed or stale-key proof }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Agent/key not eligible }

  /v1/agents/{agent_id}/keys/rotation-challenge:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: Start dual-proof agent key rotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_public_key_pem]
              properties:
                new_public_key_pem: { type: string }
      responses:
        '201': { description: Rotation challenge requiring old-key and new-key signatures }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Rotation rejected or already pending }

  /v1/agents/{agent_id}/keys/rotation-complete:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: Complete dual-proof key rotation atomically
      description: An active paid passport is reissued without a second payment and without extending expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rotation_id, challenge, current_key_signature, new_key_signature]
              properties:
                rotation_id: { type: string, format: uuid }
                challenge: { type: string }
                current_key_signature: { type: string }
                new_key_signature: { type: string }
      responses:
        '200': { description: Key rotated; passport reissued when applicable }
        '401': { description: Challenge/signature validation failed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Transactional rotation precondition failed }

  /v1/agents/{agent_id}/keys/{key_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/AgentKeyId'
    post:
      summary: Emergency revoke an agent key
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Key revoked; current-key revocation suspends agent and revokes active passport }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{agent_id}/passport-checkout:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      summary: Create hosted Agent Passport checkout
      description: Price and currency are selected server-side and correlated to the future signed payment event.
      responses:
        '201':
          description: Checkout session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Agent not eligible, active passport exists or idempotency conflict }

  /v1/webhooks/payment-provider:
    post:
      security: []
      summary: Sandbox payment-provider webhook
      description: Production requires a provider-native signed webhook adapter; sandbox is rejected in production.
      responses:
        '201': { description: Payment accepted and passport issued atomically }
        '200': { description: Reversal processed or duplicate event }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid webhook signature }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Payment correlation/finalization rejected }

  /v1/wallet:
    get:
      summary: Read ledger-derived referral wallet
      parameters:
        - in: query
          name: agent_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pending/available/debt/paid/reversed snapshot }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/wallet/transactions:
    get:
      summary: Read recent agent-scoped ledger entries
      parameters:
        - in: query
          name: agent_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Recent sealed ledger entries }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/passports/{passport_id}:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      security: []
      summary: Fetch signed Agent Passport
      responses:
        '200':
          description: Passport claims, signature and live status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPassport' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/passports/{passport_id}/status:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      security: []
      summary: Read live passport status
      responses:
        '200': { description: Current status and expiry }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/passports/{passport_id}/verify:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      security: []
      summary: Verify signature, issuer key, expiry and live passport status
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [valid, status, agent_id, issuer_key_id]
                properties:
                  valid: { type: boolean }
                  status: { type: string }
                  agent_id: { type: string }
                  issuer_key_id:
                    oneOf:
                      - { type: string }
                      - { type: 'null' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/passports/{passport_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      summary: Revoke a passport owned by the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AgentId:
      in: path
      name: agent_id
      required: true
      schema: { type: string }
    AgentKeyId:
      in: path
      name: key_id
      required: true
      schema: { type: string, pattern: '^key_ed25519_[A-Za-z0-9_-]+$' }
    IssuerKeyId:
      in: path
      name: issuer_key_id
      required: true
      schema: { type: string, pattern: '^issuer_ed25519_[A-Za-z0-9_-]+$' }
    PassportId:
      in: path
      name: passport_id
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }

  schemas:
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [public_key_pem, endpoint]
      properties:
        organization_id: { type: string, format: uuid }
        public_key_pem: { type: string, description: Ed25519 SPKI PEM }
        endpoint: { type: string, format: uri }
        capabilities:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 128 }
        referral_code: { type: string }

    AgentKey:
      type: object
      required: [agent_id, key_id, algorithm, public_key_pem, activated_at]
      properties:
        agent_id: { type: string }
        key_id: { type: string }
        algorithm: { const: Ed25519 }
        public_key_pem: { type: string }
        activated_at: { type: string, format: date-time }

    HistoricalAgentKey:
      allOf:
        - $ref: '#/components/schemas/AgentKey'
        - type: object
          required: [revoked_at, active]
          properties:
            revoked_at:
              oneOf:
                - { type: string, format: date-time }
                - { type: 'null' }
            active: { type: boolean }

    PublicJwk:
      type: object
      additionalProperties: false
      required: [kty, crv, x, kid, alg, use]
      properties:
        kty: { const: OKP }
        crv: { const: Ed25519 }
        x: { type: string }
        kid: { type: string }
        alg: { const: EdDSA }
        use: { const: sig }

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/PublicJwk' }

    IssuerMetadata:
      type: object
      required: [issuer, credential_type, schema_versions, signing_algorithms, active_key_id, jwks_uri, key_uri_template, status]
      properties:
        issuer: { type: string, format: uri }
        credential_type: { const: CREDALYX Agent Passport }
        schema_versions:
          type: array
          items: { enum: ['1.0', '1.1'] }
        signing_algorithms:
          type: array
          items: { const: EdDSA }
        active_key_id: { type: string }
        jwks_uri: { type: string, format: uri }
        key_uri_template: { type: string }
        status: { const: operational }

    IssuerKey:
      type: object
      required: [key_id, algorithm, public_key_pem, public_jwk, status, provider, activated_at, retired_at, revoked_at]
      properties:
        key_id: { type: string }
        algorithm: { const: Ed25519 }
        public_key_pem: { type: string }
        public_jwk: { $ref: '#/components/schemas/PublicJwk' }
        status: { enum: [active, retired, revoked] }
        provider: { type: string }
        activated_at: { type: string, format: date-time }
        retired_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        revoked_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]

    AgentPassport:
      type: object
      required:
        - passport_id
        - passport_version
        - agent_id
        - issuer
        - subject
        - verification_level
        - capabilities
        - issued_at
        - expires_at
        - public_key_reference
        - status_reference
        - schema_version
        - signature
        - status
      properties:
        passport_id: { type: string }
        passport_version: { type: integer, minimum: 1 }
        agent_id: { type: string }
        issuer: { type: string, format: uri }
        issuer_key_id:
          description: Required for schema 1.1; absent on legacy schema 1.0 credentials.
          type: string
        subject: { type: string }
        verification_level: { type: integer, minimum: 0, maximum: 3 }
        capabilities: { type: array, items: { type: string } }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        public_key_reference: { type: string, format: uri }
        status_reference: { type: string, format: uri }
        schema_version: { enum: ['1.0', '1.1'] }
        signature: { type: string }
        status: { enum: [active, suspended, revoked, expired] }

    CheckoutSession:
      type: object
      required: [purchase_id, provider, checkout_url, amount_minor, currency, expires_at]
      properties:
        purchase_id: { type: string }
        provider: { type: string }
        checkout_url: { type: string, format: uri }
        amount_minor: { type: string, pattern: '^[0-9]+$' }
        currency: { const: USD }
        expires_at: { type: string, format: date-time }

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code: { type: string, minLength: 3, maxLength: 128 }

  responses:
    BadRequest: { description: Invalid input }
    Forbidden: { description: Authenticated principal cannot access the tenant/resource }
    NotFound: { description: Resource not found }
