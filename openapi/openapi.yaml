openapi: 3.1.0
info:
  title: CREDALYX Agent Passport API
  version: 0.4.0
  description: |
    API for registering AI agents, proving control of versioned Ed25519 keys, rotating and revoking
    agent keys, creating provider checkout sessions, issuing/reissuing and verifying internal
    CREDALYX Agent Passports, and exposing referral-ledger wallet views. Agent Passports are not
    government identity documents, licences, KYC results, regulatory approvals, or stored-value bank accounts.
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': { description: Healthy }

  /v1/agents:
    post:
      summary: Register an agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '201':
          description: Agent registered
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, verification_level, referral_code]
                properties:
                  agent_id: { type: string }
                  verification_level: { const: 0 }
                  referral_code: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Registration or referral conflict }

  /v1/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      security: []
      summary: Read public agent registry data
      responses:
        '200':
          description: Public agent record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicAgent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{agent_id}/keys/current:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      security: []
      summary: Resolve the current active agent verification key
      responses:
        '200':
          description: Current Ed25519 key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{agent_id}/keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/KeyId'
    get:
      security: []
      summary: Resolve an exact current or historical agent verification key
      description: |
        Key identifiers are deterministic SHA-256 fingerprints of Ed25519 SPKI public-key material.
        Historical revoked keys remain resolvable so a passport can never silently resolve against a newer key.
      responses:
        '200':
          description: Exact key version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoricalAgentKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{agent_id}/challenge:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: Create a one-time agent-control challenge bound to the current key
      responses:
        '200':
          description: Challenge and exact signing payload
          content:
            application/json:
              schema:
                type: object
                required: [challenge, signing_payload, key_id, algorithm, expires_at]
                properties:
                  challenge: { type: string }
                  signing_payload: { type: string }
                  key_id: { type: string }
                  algorithm: { const: Ed25519 }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: No active key or challenge creation rejected }

  /v1/agents/{agent_id}/verify-control:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: Verify Ed25519 proof of possession of the challenge-bound active key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge, signature]
              properties:
                challenge: { type: string }
                signature:
                  type: string
                  description: Base64url Ed25519 signature over signing_payload from the challenge response.
      responses:
        '200':
          description: Control verified
          content:
            application/json:
              schema:
                type: object
                required: [verified, verification_level, key_id]
                properties:
                  verified: { const: true }
                  verification_level: { const: 1 }
                  key_id: { type: string }
        '401': { description: Invalid signature, expired/replayed challenge, or stale key binding }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: No active key }

  /v1/agents/{agent_id}/keys/rotation-challenge:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: Start dual-proof Ed25519 key rotation
      description: |
        Creates one pending rotation. The returned signing_payload must be signed by both the current
        active private key and the proposed new private key. Private keys are never submitted to CREDALYX.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartKeyRotationRequest' }
      responses:
        '201':
          description: Rotation challenge created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyRotationChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Rotation already pending, same key supplied, or no active key }

  /v1/agents/{agent_id}/keys/rotation-complete:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: Complete a dual-proof key rotation atomically
      description: |
        Both signatures must verify over the exact rotation signing_payload. If the agent has an active
        paid passport, CREDALYX revokes the old passport and reissues the next passport version referencing
        the new key without a second payment and without extending the original expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteKeyRotationRequest' }
      responses:
        '200':
          description: Key rotated and passport reissued when applicable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyRotationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Rotation expired, challenge mismatch, or either signature invalid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Rotation no longer pending or transactional precondition changed }

  /v1/agents/{agent_id}/keys/{key_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/KeyId'
    post:
      summary: Emergency revoke an agent verification key
      description: |
        Revoking the current active key suspends the agent and revokes active passports. This endpoint
        intentionally does not install a replacement key; account recovery is a separate high-assurance flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties:
                reason_code: { type: string, minLength: 3, maxLength: 128 }
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                type: object
                required: [revoked, key_id, agent_suspended, passport_revoked]
                properties:
                  revoked: { type: boolean }
                  key_id: { type: string }
                  agent_suspended: { type: boolean }
                  passport_revoked: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{agent_id}/passport-checkout:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      summary: Create a hosted checkout session for an Agent Passport
      description: |
        The server selects the configured price and currency. Frontend-provided prices are not accepted.
        A successful payment webhook must correlate back to this persisted checkout before a passport can issue.
      responses:
        '201':
          description: Checkout created or idempotently returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '400': { description: Missing/invalid idempotency key }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Agent not verified, active passport exists, or idempotency conflict }

  /v1/webhooks/payment-provider:
    post:
      security: []
      summary: Sandbox payment-provider webhook
      description: |
        Sandbox-only adapter. Production startup rejects this adapter. A production provider integration must
        verify the provider's native signature over the required raw request representation before processing.
      parameters:
        - in: header
          name: x-sandbox-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: x-sandbox-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PaymentSucceededEvent'
                - $ref: '#/components/schemas/PaymentReversalEvent'
              discriminator:
                propertyName: type
      responses:
        '201': { description: Payment accepted and passport issued atomically with ledger posting }
        '200': { description: Reversal processed or provider retry already handled }
        '400': { description: Invalid event shape }
        '401': { description: Invalid webhook signature }
        '404': { description: Checkout session or purchase not found }
        '409': { description: Payment/session mismatch or finalization precondition failed }

  /v1/wallet:
    get:
      summary: Read the authenticated owner's referral wallet for one agent
      parameters:
        - in: query
          name: agent_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ledger-derived wallet snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletSnapshot' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/wallet/transactions:
    get:
      summary: Read recent agent-scoped referral ledger entries
      parameters:
        - in: query
          name: agent_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Recent sealed ledger entries. Cursor pagination is scheduled before production launch.
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WalletTransaction' }
                  has_more: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/passports/{passport_id}:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      security: []
      summary: Fetch a signed Agent Passport
      responses:
        '200': { description: Signed passport claims, passport_version, signature and current status }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/passports/{passport_id}/status:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      security: []
      summary: Read live passport status
      responses:
        '200': { description: Current status }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/passports/{passport_id}/verify:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      security: []
      summary: Verify passport signature, issuer, expiry and live status
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [valid, status, agent_id]
                properties:
                  valid: { type: boolean }
                  status: { type: string }
                  agent_id: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/passports/{passport_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      summary: Revoke a passport owned by the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties:
                reason_code: { type: string, minLength: 3, maxLength: 128 }
      responses:
        '200': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /.well-known/agent-card.json:
    get:
      security: []
      summary: A2A Protocol v1.0 discovery card
      responses:
        '200': { description: A2A Agent Card }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AgentId:
      in: path
      name: agent_id
      required: true
      schema: { type: string }
    KeyId:
      in: path
      name: key_id
      required: true
      schema:
        type: string
        pattern: '^key_ed25519_[A-Za-z0-9_-]+$'
    PassportId:
      in: path
      name: passport_id
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Client-generated key scoped to the authenticated owner and agent checkout intent.
      schema: { type: string, minLength: 16, maxLength: 128 }

  schemas:
    MoneyMinorString:
      type: string
      pattern: '^-?[0-9]+$'
      description: Integer monetary amount in the currency's minor unit, serialized as a decimal string.

    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [public_key_pem, endpoint]
      properties:
        organization_id: { type: string, format: uuid }
        public_key_pem:
          type: string
          description: Ed25519 public key encoded as SPKI PEM.
        endpoint: { type: string, format: uri }
        capabilities:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 128 }
        referral_code: { type: string }

    PublicAgent:
      type: object
      required: [agent_id, endpoint, capabilities, verification_level, status]
      properties:
        agent_id: { type: string }
        endpoint: { type: string, format: uri }
        capabilities: { type: array, items: { type: string } }
        verification_level: { type: integer, minimum: 0, maximum: 3 }
        status: { enum: [pending, active, suspended, revoked] }

    AgentKey:
      type: object
      required: [agent_id, key_id, algorithm, public_key_pem, activated_at]
      properties:
        agent_id: { type: string }
        key_id: { type: string }
        algorithm: { const: Ed25519 }
        public_key_pem: { type: string }
        activated_at: { type: string, format: date-time }

    HistoricalAgentKey:
      allOf:
        - $ref: '#/components/schemas/AgentKey'
        - type: object
          required: [revoked_at, active]
          properties:
            revoked_at:
              oneOf:
                - { type: string, format: date-time }
                - { type: 'null' }
            active: { type: boolean }

    StartKeyRotationRequest:
      type: object
      additionalProperties: false
      required: [new_public_key_pem]
      properties:
        new_public_key_pem:
          type: string
          description: Proposed Ed25519 public key encoded as SPKI PEM.

    KeyRotationChallenge:
      type: object
      required:
        - rotation_id
        - challenge
        - signing_payload
        - old_key_id
        - new_key_id
        - algorithm
        - required_signatures
        - expires_at
      properties:
        rotation_id: { type: string, format: uuid }
        challenge: { type: string }
        signing_payload: { type: string }
        old_key_id: { type: string }
        new_key_id: { type: string }
        algorithm: { const: Ed25519 }
        required_signatures:
          type: array
          prefixItems:
            - { const: current_key }
            - { const: new_key }
          minItems: 2
          maxItems: 2
        expires_at: { type: string, format: date-time }

    CompleteKeyRotationRequest:
      type: object
      additionalProperties: false
      required: [rotation_id, challenge, current_key_signature, new_key_signature]
      properties:
        rotation_id: { type: string, format: uuid }
        challenge: { type: string }
        current_key_signature:
          type: string
          description: Base64url Ed25519 signature by the current key over the exact signing_payload.
        new_key_signature:
          type: string
          description: Base64url Ed25519 signature by the proposed new key over the exact signing_payload.

    KeyRotationResult:
      type: object
      required: [rotated, agent_id, old_key_id, new_key_id, reissued_passport_id]
      properties:
        rotated: { const: true }
        agent_id: { type: string }
        old_key_id: { type: string }
        new_key_id: { type: string }
        reissued_passport_id:
          oneOf:
            - { type: string }
            - { type: 'null' }

    CheckoutSession:
      type: object
      required: [purchase_id, provider, checkout_url, amount_minor, currency, expires_at]
      properties:
        purchase_id: { type: string }
        provider: { type: string }
        checkout_url: { type: string, format: uri }
        amount_minor: { $ref: '#/components/schemas/MoneyMinorString' }
        currency: { const: USD }
        expires_at: { type: string, format: date-time }

    PaymentSucceededEvent:
      type: object
      additionalProperties: false
      required: [event_id, type, purchase_id, agent_id, amount_minor, currency]
      properties:
        event_id: { type: string }
        type: { const: payment.succeeded }
        purchase_id: { type: string }
        agent_id: { type: string }
        amount_minor: { type: integer, minimum: 1 }
        currency: { const: USD }

    PaymentReversalEvent:
      type: object
      additionalProperties: false
      required: [event_id, type, purchase_id, amount_minor, currency, reason_code]
      properties:
        event_id: { type: string }
        type: { enum: [payment.refunded, payment.chargeback] }
        purchase_id: { type: string }
        amount_minor: { type: integer, minimum: 1 }
        currency: { const: USD }
        reason_code: { type: string, minLength: 3, maxLength: 128 }

    WalletSnapshot:
      type: object
      required:
        - currency
        - pending_minor
        - available_minor
        - debt_minor
        - paid_minor
        - reversed_minor
        - min_payout_minor
        - payout_eligible
      properties:
        currency: { const: USD }
        pending_minor: { $ref: '#/components/schemas/MoneyMinorString' }
        available_minor: { $ref: '#/components/schemas/MoneyMinorString' }
        debt_minor: { $ref: '#/components/schemas/MoneyMinorString' }
        paid_minor: { $ref: '#/components/schemas/MoneyMinorString' }
        reversed_minor: { $ref: '#/components/schemas/MoneyMinorString' }
        min_payout_minor: { $ref: '#/components/schemas/MoneyMinorString' }
        payout_eligible: { type: boolean }

    WalletTransaction:
      type: object
      required: [transaction_id, transaction_type, external_reference, created_at, account, amount_minor, currency]
      properties:
        transaction_id: { type: string, format: uuid }
        transaction_type: { type: string }
        external_reference: { type: string }
        created_at: { type: string, format: date-time }
        account: { type: string }
        amount_minor: { $ref: '#/components/schemas/MoneyMinorString' }
        currency: { const: USD }

  responses:
    BadRequest:
      description: Invalid input
    Forbidden:
      description: Authenticated principal cannot access the tenant/resource
    NotFound:
      description: Resource not found
